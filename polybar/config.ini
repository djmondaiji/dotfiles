[colors]
background = #EE20282E
background-alt = #FF303A40
surface = #FF273138
surface-light = #FF45545B

foreground = #FFE5EAEB
foreground-alt = #FFAABBC0
muted = #FF87969B

primary = #FF83B8C4
secondary = #FF91B6A4

good = #FF91B6A4
warning = #FFC8B994
alert = #FFC17D78

transparent = #00000000



[bar/main]

width = 100%
height = 32pt

offset-x = 1%
offset-y = 6pt

bottom = true
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

radius = 9

border-size = 1
border-color = ${colors.surface-light}

line-size = 2pt
line-color = ${colors.primary}

padding-left = 2
padding-right = 2

module-margin = 1

separator =
separator-foreground = ${colors.muted}

font-0 = "Noto Sans Serif CJK JP:style=Regular:size=11;2"
font-1 = "Noto Sans Serif CJK JP:style=Bold:size=11;2"

modules-left = i3
modules-center = title
modules-right = network cpu memory filesystem pulseaudio battery date tray

wm-restack = i3
override-redirect = false
enable-struts = true

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true



[module/i3]

type = internal/i3

pin-workspaces = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = true

wrapping-scroll = false

format = <label-state>

label-focused = %name%
label-focused-foreground = ${colors.foreground}
label-focused-background = ${colors.surface}
label-focused-underline = ${colors.primary}
label-focused-padding = 3

label-unfocused = %name%
label-unfocused-foreground = ${colors.muted}
label-unfocused-padding = 3

label-visible = %name%
label-visible-foreground = ${colors.foreground-alt}
label-visible-background = ${colors.surface}
label-visible-padding = 3

label-urgent = %name%
label-urgent-foreground = ${colors.alert}
label-urgent-background = ${colors.surface}
label-urgent-padding = 3

[module/tray]
type = internal/tray

format-margin = 8px
tray-size = 18
tray-spacing = 8px
tray-background = ${colors.background}


[module/title]

type = internal/xwindow

format = <label>

label = %title%
label-maxlen = 45
label-foreground = ${colors.muted}

label-empty = "静寂"
label-empty-foreground = ${colors.muted}



[module/network]

type = internal/network

interface-type = wireless
interval = 5

format-connected = <ramp-signal> <label-connected>
format-disconnected = <label-disconnected>

label-connected = %essid%
label-connected-foreground = ${colors.foreground-alt}

label-disconnected = 󰖪 未接続
label-disconnected-foreground = ${colors.muted}

ramp-signal-0 = 󰤟
ramp-signal-1 = 󰤢
ramp-signal-2 = 󰤥
ramp-signal-3 = 󰤨

ramp-signal-foreground = ${colors.secondary}



[module/cpu]

type = internal/cpu

interval = 2

format = <label>
format-prefix = "󰻠 "
format-prefix-foreground = ${colors.primary}

label = %percentage:2%%
label-foreground = ${colors.foreground-alt}



[module/memory]

type = internal/memory

interval = 3

format = <label>
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.primary}

label = %gb_used%
label-foreground = ${colors.foreground-alt}



[module/filesystem]

type = internal/fs

interval = 30

mount-0 = /

format-mounted = <label-mounted>

format-mounted-prefix = "󰋊 "
format-mounted-prefix-foreground = ${colors.primary}

label-mounted = %free%
label-mounted-foreground = ${colors.foreground-alt}

format-unmounted = <label-unmounted>
label-unmounted = %mountpoint% 未接続



[module/pulseaudio]

type = internal/pulseaudio

use-ui-max = true

format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-volume-foreground = ${colors.foreground-alt}

format-muted = <label-muted>
label-muted = 󰝟 消音
label-muted-foreground = ${colors.muted}

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾

ramp-volume-foreground = ${colors.primary}

click-right = pavucontrol



[module/battery]

type = internal/battery

battery = BAT0
adapter = AC

poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = 満充電

label-charging-foreground = ${colors.secondary}
label-discharging-foreground = ${colors.foreground-alt}
label-full-foreground = ${colors.secondary}

ramp-capacity-0 = 󰂎
ramp-capacity-1 = 󰁺
ramp-capacity-2 = 󰁻
ramp-capacity-3 = 󰁼
ramp-capacity-4 = 󰁽
ramp-capacity-5 = 󰁾
ramp-capacity-6 = 󰁿
ramp-capacity-7 = 󰂀
ramp-capacity-8 = 󰂁
ramp-capacity-9 = 󰂂

ramp-capacity-foreground = ${colors.primary}

animation-charging-0 = 󰂄
animation-charging-1 = 󰂅
animation-charging-framerate = 750



[module/date]

type = internal/date

interval = 1
date = %m月%d日 (%a)
time = %H:%M

label = 󰥔 %date%  |  %time%
label-foreground = ${colors.primary}



[settings]

screenchange-reload = true
pseudo-transparency = true
