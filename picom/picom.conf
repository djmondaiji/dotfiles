backend = "glx";

vsync = true;

shadow = true;
shadow-radius = 18;
shadow-offset-x = -5;
shadow-offset-y = -5;
shadow-opacity = 0.22;

inactive-opacity = 0.94;
active-opacity = 0.97;
frame-opacity = 0.95;

blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true

corner-radius = 8;

shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'i3bar'"
];

blur-background-exclude = [
    "window_type = 'desktop'",
    "window_type = 'dock'"
];

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 8;

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
use-damage = true;
